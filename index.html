<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { 
  getDatabase, 
  ref, 
  push, 
  onValue, 
  remove, 
  update 
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyCe_CR-MGDP0pJGOX4y18I_Qx-V-kGsiMs",
  authDomain: "library-kheri.firebaseapp.com",
  databaseURL: "https://library-kheri-default-rtdb.firebaseio.com",
  projectId: "library-kheri",
  storageBucket: "library-kheri.firebasestorage.app",
  messagingSenderId: "67436194814",
  appId: "1:67436194814:web:f2fa8e22dfcf2d6b662eaf"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

/* ===========================
   📚 BOOK ADD
=========================== */

document.getElementById("addBookForm").addEventListener("submit", function(e){
  e.preventDefault();

  const book = {
    title: bookTitle.value,
    author: bookAuthor.value,
    isbn: bookISBN.value,
    publisher: bookPublisher.value,
    category: bookCategory.value,
    quantity: parseInt(bookQuantity.value),
    available: parseInt(bookQuantity.value),
    addedDate: new Date().toLocaleDateString("hi-IN")
  };

  push(ref(database,"books"), book);
  alert("✅ Kitaab Firebase me save ho gayi!");
  this.reset();
});

/* ===========================
   👥 MEMBER ADD
=========================== */

document.getElementById("addMemberForm").addEventListener("submit", function(e){
  e.preventDefault();

  const member = {
    name: memberName.value,
    email: memberEmail.value,
    phone: memberPhone.value,
    type: membershipType.value,
    joinDate: new Date().toLocaleDateString("hi-IN")
  };

  push(ref(database,"members"), member);
  alert("✅ Member Firebase me save ho gaya!");
  this.reset();
});

/* ===========================
   📖 LOAD BOOKS
=========================== */

const booksRef = ref(database,"books");
onValue(booksRef,(snapshot)=>{
  const data = snapshot.val();
  const grid = document.getElementById("booksGrid");

  if(!data){
    grid.innerHTML = "Koi kitab nahi mili";
    return;
  }

  grid.innerHTML = Object.entries(data).map(([id,book])=>`
    <div class="book-card">
      <h3>${book.title}</h3>
      <p><strong>Lekhak:</strong> ${book.author}</p>
      <p><strong>Available:</strong> ${book.available}/${book.quantity}</p>
      <button onclick="deleteBook('${id}')" class="btn btn-danger">Delete</button>
    </div>
  `).join("");
});

/* ===========================
   👥 LOAD MEMBERS
=========================== */

const membersRef = ref(database,"members");
onValue(membersRef,(snapshot)=>{
  const data = snapshot.val();
  const list = document.getElementById("membersList");

  if(!data){
    list.innerHTML = "Koi member nahi mila";
    return;
  }

  list.innerHTML = Object.entries(data).map(([id,member])=>`
    <div class="member-card">
      <h4>${member.name}</h4>
      <p>${member.type}</p>
      <button onclick="deleteMember('${id}')" class="btn btn-danger">Delete</button>
    </div>
  `).join("");
});

/* ===========================
   🗑 DELETE FUNCTIONS
=========================== */

window.deleteBook = function(id){
  remove(ref(database,"books/"+id));
}

window.deleteMember = function(id){
  remove(ref(database,"members/"+id));
}

</script>
